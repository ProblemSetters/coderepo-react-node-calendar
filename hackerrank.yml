version: 1.0
configuration:
  has_webserver: true
  readonly_paths:
    - backend/__tests__/**
    - backend/jest.config.js
    - backend/src/scripts/**
    - backend/src/shared/config/database.js
    - backend/src/shared/config/index.js
    - frontend/__tests__/**
    - frontend/vite.config.js
  ide_config:
    default_open_files:
      - backend/src/app.js
      - frontend/src/App.jsx
    project_menu:
      run: bun start
      install: bun install
      test: echo "No test command configured"
