version: 1.0
configuration:
  has_webserver: true
  scoring:
    command: rm -f output/backend.xml output/frontend.xml && bun install && bash setup.sh --seed && bun run test
    files:
      - output/backend.xml
      - output/frontend.xml
  readonly_paths:
    - hackerrank.yml
    - setup.sh
    - scripts/**
    - backend/__tests__/**
    - backend/jest.config.js
    - backend/src/scripts/**
    - backend/src/shared/config/database.js
    - backend/src/shared/config/index.js
    - frontend/src/__tests__/**
    - frontend/vitest.config.js
    - frontend/vite.config.js
  ide_config:
    default_open_files:
      - backend/src/app.js
      - frontend/src/App.jsx
    project_menu:
      run: bun start
      install: bun install && bash setup.sh --seed
      test: rm -f output/backend.xml output/frontend.xml && bun run test
    ports_settings:
      "3000":
        name: Frontend
        hidePreview: false
        primary: true
      "8000":
        name: Backend
        hidePreview: true
